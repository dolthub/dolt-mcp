name: Upload Dolt MCP Server DoltLite Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer release tag to upload assets to (e.g. 0.24.5 or v0.24.5)'
        required: true
  workflow_call:
    inputs:
      version:
        description: 'SemVer release tag to upload assets to (e.g. 0.24.5 or v0.24.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOLTLITE_VERSION: v0.11.51

jobs:
  format-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.format_version.outputs.version }}
      tag: ${{ steps.format_version.outputs.tag }}
    steps:
      - name: Format Input
        id: format_version
        run: |
          version="${{ inputs.version }}"
          if [[ $version == v* ]]; then
            version="${version:1}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: format-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            doltlite_platform: linux-x64
            archive_platform: linux-amd64
          - os: ubuntu-24.04-arm
            doltlite_platform: linux-arm64
            archive_platform: linux-arm64
          - os: macos-15-intel
            doltlite_platform: osx-x64
            archive_platform: darwin-amd64
          - os: macos-15
            doltlite_platform: osx-arm64
            archive_platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.format-version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy build script from main
        run: |
          cp .github/scripts/build_doltlite_binary.sh "$RUNNER_TEMP/build_doltlite_binary.sh"
          cp .github/scripts/build_doltlite_binary_in_docker.sh "$RUNNER_TEMP/build_doltlite_binary_in_docker.sh"
          cp .github/scripts/Dockerfile.doltlite-release "$RUNNER_TEMP/Dockerfile.doltlite-release"
          chmod +x "$RUNNER_TEMP/build_doltlite_binary.sh"
          chmod +x "$RUNNER_TEMP/build_doltlite_binary_in_docker.sh"

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up Go
        if: runner.os != 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Set OUT_DIR
        run: echo "OUT_DIR=$RUNNER_TEMP/dolt-mcp-doltlite-assets" >> "$GITHUB_ENV"

      - name: Prepare output directory
        run: mkdir -p "$OUT_DIR"

      - name: Build DoltLite Binary in Docker
        if: runner.os == 'Linux'
        run: |
          "$RUNNER_TEMP/build_doltlite_binary_in_docker.sh" \
            "${{ matrix.doltlite_platform }}" \
            "${{ matrix.archive_platform }}" \
            "$OUT_DIR"

      - name: Build DoltLite Binary Natively
        if: runner.os != 'Linux'
        run: |
          "$RUNNER_TEMP/build_doltlite_binary.sh" \
            "${{ matrix.doltlite_platform }}" \
            "${{ matrix.archive_platform }}" \
            "$OUT_DIR"

      - name: Upload asset to existing release (clobber)
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$OUT_DIR/dolt-mcp-server-doltlite-${{ matrix.archive_platform }}.tar.gz" \
            --clobber

  build-and-upload-windows:
    needs: format-version
    runs-on: windows-latest
    env:
      TAG: ${{ needs.format-version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            curl
            make
            tcl
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Build DoltLite Binary
        run: |
          set -euo pipefail
          version_num="${DOLTLITE_VERSION#v}"
          source_name="doltlite-${version_num}"
          source_url="https://github.com/dolthub/doltlite/archive/refs/tags/${DOLTLITE_VERSION}.tar.gz"
          source_parent="$(mktemp -d)"
          lib_dir="${source_parent}/build"

          curl -fsSL -o "${source_parent}/doltlite.tar.gz" "$source_url"
          tar -xzf "${source_parent}/doltlite.tar.gz" -C "$source_parent"
          mkdir -p "$lib_dir" staging out
          (
            cd "$lib_dir"
            "${source_parent}/${source_name}/configure"
            make -j"$(nproc)" doltlite-lib
          )
          cp "${lib_dir}/libdoltlite.a" "${lib_dir}/libsqlite3.a"

          export CGO_ENABLED=1
          export CGO_CFLAGS="-I${lib_dir}"
          export CGO_LDFLAGS="-L${lib_dir} -static -lz -lpthread -lm -lws2_32 -lbcrypt -lcrypt32"
          go build -buildvcs=false -trimpath -tags "doltlite libsqlite3" -ldflags "-s -w" \
            -o staging/dolt-mcp-server-doltlite.exe ./mcp/cmd/dolt-mcp-server
          ./staging/dolt-mcp-server-doltlite.exe --version

          out_abs="$(pwd)/out"
          (cd staging && zip -q "${out_abs}/dolt-mcp-server-doltlite-windows-amd64.zip" \
            dolt-mcp-server-doltlite.exe)

      - name: Upload asset to existing release (clobber)
        shell: pwsh
        run: gh release upload "$env:TAG" "out/dolt-mcp-server-doltlite-windows-amd64.zip" --clobber
